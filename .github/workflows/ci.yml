name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build Traxs.SharedKernel.slnx --configuration Release

      - name: Test
        run: dotnet test Traxs.SharedKernel.slnx --configuration Release --no-build --no-restore
