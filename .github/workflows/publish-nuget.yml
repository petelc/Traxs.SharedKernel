name: Publish NuGet Package

on:
  release:
    types: [published]

env:
  SOLUTION_FILE: Traxs.SharedKernel.slnx
  PACK_OUTPUT: artifacts/package/release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Configure NuGet credentials
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source --username petelc --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/petelc/index.json"

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release

      - name: Test
        run: dotnet test "${{ env.SOLUTION_FILE }}" --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack "${{ env.SOLUTION_FILE }}" --configuration Release --no-build --no-restore --output "${{ env.PACK_OUTPUT }}"

      - name: Publish to GitHub Packages
        run: dotnet nuget push "${{ env.PACK_OUTPUT }}/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/petelc/index.json --skip-duplicate
